<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroMaths: Mission Control</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#070A13;--purple:#6366F1;--cyan:#06B6D4;--gold:#F59E0B;--green:#10B981;--text:#E5E9F5;--muted:#8B93AD;--glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 20% 0%,rgba(99,102,241,.18),transparent 55%),radial-gradient(ellipse at 90% 80%,rgba(6,182,212,.12),transparent 50%),var(--bg)}
#stars{position:fixed;inset:0;z-index:-1}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:1.7rem;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-size:.65rem;letter-spacing:.35em;-webkit-text-fill-color:var(--muted)}
.panel{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{padding:10px 16px;text-align:center;min-width:92px}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.65rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 10px var(--cyan)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0}
.map{display:grid;gap:14px}
.sector{border-left:3px solid var(--c)}
.sector.locked{opacity:.45;filter:grayscale(.7)}
.sector h3{margin:0;color:var(--c);text-shadow:0 0 12px var(--c)}
.sector p{margin:4px 0 12px;color:var(--muted);font-size:.85rem}
.nodes{display:flex;gap:8px;flex-wrap:wrap}
.node{cursor:pointer;border:1px solid var(--c);color:var(--text);background:rgba(0,0,0,.35);border-radius:999px;padding:8px 14px;font-size:.82rem;font-family:inherit;transition:.2s}
.node small{color:var(--muted);margin-left:6px}
.node:hover:not(:disabled){box-shadow:0 0 14px var(--c);transform:translateY(-2px)}
.node.m{background:var(--green);border-color:var(--green);color:#04130d;font-weight:600}.node.m small{color:#04130d}
.node:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
#terminal{display:none;margin-top:26px;border-color:var(--cyan);box-shadow:0 0 30px rgba(6,182,212,.15)}
#terminal h3{margin:0;color:var(--cyan)}
.how{background:rgba(0,0,0,.3);border-left:3px solid var(--purple);padding:12px 16px;margin:14px 0;border-radius:0 10px 10px 0;line-height:1.7}
.q{font-size:1.3rem;margin:14px 0;line-height:1.7}
.katex{text-shadow:0 0 10px rgba(6,182,212,.7)}
input[type=text],input[type=search]{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:1rem;width:240px;max-width:100%}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.btn{cursor:pointer;border:1px solid var(--purple);background:rgba(99,102,241,.2);color:var(--text);padding:10px 16px;border-radius:10px;font-family:inherit;font-size:.9rem}
.btn:hover{box-shadow:0 0 14px var(--purple)}
.btn.go{border-color:var(--green);background:rgba(16,185,129,.2)}
#msg{margin-top:12px;min-height:1.4em;font-weight:600}
#qn{color:var(--gold);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase}
footer{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.75rem;align-items:center}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
<header>
  <h1>AstroMaths<small>Mission Control</small></h1>
  <div class="stats">
    <div class="panel stat"><b style="color:var(--gold)" id="xp">0</b><span>Total XP</span></div>
    <div class="panel stat"><b style="color:var(--cyan)" id="streak">0</b><span>Day Streak</span></div>
    <div class="panel stat"><b style="color:var(--green)" id="mast">0</b><span>Mastered</span></div>
  </div>
</header>
<div class="panel"><span id="rank" style="letter-spacing:.2em;text-transform:uppercase;font-size:.8rem"></span><div class="bar"><i id="prog" style="width:0"></i></div></div>

<div class="row" style="margin:26px 0 12px;justify-content:space-between"><h2>Starmap: Sector Navigation</h2>
<input type="search" id="search" placeholder="Search activities (e.g. quadratic, Y8, ratio)"></div>
<div class="map" id="map"></div>
<details class="panel" style="margin-top:20px"><summary style="cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;color:var(--muted)">NCEA Achievement Standards map (click a standard to see its activities)</summary><div id="std"></div></details>

<div class="panel" id="terminal">
  <div class="row" style="justify-content:space-between"><h3 id="tTitle"></h3><button class="btn" onclick="closeT()">Close</button></div>
  <div style="color:var(--muted);font-size:.8rem" id="tMeta"></div>
  <div class="how" id="how"></div>
  <button class="btn go" id="startBtn" onclick="startQ()">Start Mastery Challenge (10 in a row)</button>
  <div id="quiz" style="display:none">
    <div id="qn"></div><div class="q" id="tQ"></div>
    <div class="row"><input type="text" id="ans" placeholder="Answer (e.g. 5, 7/8, 0.25)" autocomplete="off"><button class="btn" id="sendBtn" onclick="check()">Transmit</button><button class="btn" id="retryBtn" style="display:none" onclick="startQ()">Retry with 10 new questions</button></div>
  </div>
  <div id="msg"></div>
</div>

<footer>
  <span>Ship Computer Storage:</span>
  <button class="btn" onclick="exportLog()">Export Flight Log</button>
  <button class="btn" onclick="$('imp').click()">Import Flight Log</button>
  <input type="file" id="imp" accept=".json" hidden>
  <button class="btn" onclick="resetAll()">Reset</button>
  <span>Progress is saved in this browser only.</span><span id="saved"></span>
</footer>
</div>

<script>
const SECTORS=[
 {name:"Sector 1: Planetary Base",yrs:"Years 0–6",c:"#10B981"},
 {name:"Sector 2: Lunar Orbit",yrs:"Years 7–8",c:"#06B6D4"},
 {name:"Sector 3: Asteroid Belt",yrs:"Years 9–11",c:"#6366F1"},
 {name:"Sector 4: Deep Space",yrs:"Years 12–13",c:"#F59E0B"},
 {name:"Sector 5: The Singularity",yrs:"NZMO & IMO",c:"#EC4899"}];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)];
const fact=n=>n<2?1:n*fact(n-1),C=(n,k)=>fact(n)/fact(k)/fact(n-k);
const mp=(b,e,m)=>{let r=1;for(let i=0;i<e;i++)r=r*b%m;return r};
const sg=n=>n<0?`(${n})`:n,sx=n=>(n<0?"-":"+")+Math.abs(n);
const T=[],add=(s,y,t,d,g,a="")=>T.push({s,y,t,d,g,a});
// ---- Sector 1
add(1,"Y0-2","Place Value","Every digit has a value that depends on its place. In 352 the 5 is in the tens place, so it is worth $5\\times10=50$. Find which place the digit is in, then multiply the digit by 1, 10 or 100.",()=>{const n=R(100,999),d=P([1,10,100]);return[`What is the value of the ${{1:"ones",10:"tens",100:"hundreds"}[d]} digit in ${n}?`,Math.floor(n/d)%10*d]});
add(1,"Y1-3","Add & Subtract","Line digits up by place value and work from the ones column. Carry when a column makes 10 or more, borrow when you can't take away. Example: $345+478$: ones $5+8=13$ (write 3, carry 1), tens $4+7+1=12$ (write 2, carry 1), hundreds $3+4+1=8$, so $823$.",()=>{const a=R(120,950),b=R(15,99);return P([0,1])?[`${a} + ${b}`,a+b]:[`${a} − ${b}`,a-b]});
add(1,"Y3-4","Times Tables & Division","Learn your tables by heart. Division is multiplication backwards: $42\\div6=7$ because $6\\times7=42$. Ask yourself: what times the divisor gives the number?",()=>{const a=R(2,12),b=R(2,12);return P([0,1])?[`${a} × ${b}`,a*b]:[`${a*b} ÷ ${a}`,b]});
add(1,"Y4-5","Fractions of Amounts","To find $\\frac{n}{d}$ of an amount, divide by the bottom number $d$, then multiply by the top number $n$. Example: $\\frac34$ of 20: $20\\div4=5$, then $5\\times3=15$.",()=>{const d=P([2,3,4,5,8,10]),n=R(1,d-1),k=R(2,9);return[`Find $\\frac{${n}}{${d}}$ of ${k*d}.`,n*k]});
add(1,"Y5-6","Decimals","Line up the decimal points, then add or subtract as with whole numbers. Example: $2.4+1.7=4.1$. For subtraction, take the smaller from the larger.",()=>{const a=R(11,99)/10,b=R(11,99)/10;return P([0,1])?[`${a} + ${b}`,Math.round((a+b)*10)/10]:[`${Math.max(a,b)} − ${Math.min(a,b)}`,Math.round(Math.abs(a-b)*10)/10]});
add(1,"Y4-6","Area & Perimeter","For a rectangle, area $=l\\times w$ (space inside) and perimeter $=2(l+w)$ (distance around). Example: 5 by 3: area 15, perimeter 16.",()=>{const l=R(3,20),w=R(2,15);return P([0,1])?[`Area of a ${l} by ${w} rectangle?`,l*w]:[`Perimeter of a ${l} by ${w} rectangle?`,2*(l+w)]});
add(1,"Y5-6","Angles","Angles in a triangle add to $180^\\circ$; angles on a straight line also add to $180^\\circ$. Add the known angles and subtract from 180.",()=>{const a=R(20,80),b=R(20,80);return[`A triangle has angles ${a}° and ${b}°. Find the third angle in degrees.`,180-a-b]});
add(1,"Y6","Order of Operations","Use BEDMAS: Brackets, Exponents, Divide/Multiply, then Add/Subtract. Example: $2+3\\times4=2+12=14$, but $(2+3)\\times4=20$.",()=>{const a=R(2,12),b=R(2,9),c=R(2,9);return P([0,1])?[`${a} + ${b} × ${c}`,a+b*c]:[`(${a} + ${b}) × ${c}`,(a+b)*c]});
add(1,"Y6","Percentages","Build percentages from easy ones: $10\\%$ is $\\div10$, $50\\%$ is $\\div2$, $25\\%$ is $\\div4$, $5\\%$ is half of $10\\%$. Example: $20\\%$ of 80: $10\\%=8$, so $20\\%=16$.",()=>{const p=P([10,20,25,50,5]),n=R(2,20)*20;return[`Find ${p}% of ${n}.`,p*n/100]});
add(1,"Y3-5","Measurement Units","To go to a smaller unit, multiply: m→cm ×100, km→m ×1000, kg→g ×1000, L→mL ×1000. Example: $3\\text{ km}=3000\\text{ m}$.",()=>{const n=R(2,99),[u,v,f]=P([["m","cm",100],["km","m",1000],["kg","g",1000],["L","mL",1000]]);return[`${n} ${u} = ? ${v}`,n*f]});
// ---- Sector 2
add(2,"Y7","Integers","Adding a negative moves you down the number line: $5+(-8)=-3$. Subtracting a negative is the same as adding: $4-(-3)=7$.",()=>{const a=R(-20,20),b=R(-20,20);return P([0,1])?[`${a} + ${sg(b)}`,a+b]:[`${a} − ${sg(b)}`,a-b]});
add(2,"Y7","Ratios","Add the ratio parts, divide the total by that sum to find one part, then multiply. Example: share 40 in $2:3$: 5 parts, one part is 8, so shares are 16 and 24.",()=>{const a=R(1,6),b=R(a+1,9),k=R(2,12);return[`Share ${(a+b)*k} in the ratio ${a}:${b}. How much is the larger share?`,b*k]});
add(2,"Y8","Percentage Change","For a discount of $d\\%$: new price $=\\text{old}\\times\\frac{100-d}{100}$. Example: 20% off 50 gives $50\\times0.8=40$.",()=>{const p=R(2,20)*20,d=P([10,20,25,50]);return[`An item costs ${p} dollars and is reduced by ${d}%. What is the sale price in dollars?`,p*(100-d)/100]});
add(2,"Y7-8","Linear Equations","Undo operations in reverse order: subtract the constant, then divide by the coefficient. Example: $3x+7=25\\Rightarrow3x=18\\Rightarrow x=6$.",()=>{const x=R(-5,12),a=R(2,9),b=R(1,20);return[`Solve $${a}x+${b}=${a*x+b}$.`,x]});
add(2,"Y7-8","Expressions & Substitution","Replace each letter with its value, then follow BEDMAS. If $a=2$, $b=5$ then $3a+b=6+5=11$.",()=>{const a=R(1,9),b=R(1,9),p=R(2,6),q=R(2,6);return[`If $a=${a}$ and $b=${b}$, find $${p}a+${q}b$.`,p*a+q*b]});
add(2,"Y8","Area of Triangles","Area $=\\frac12\\times\\text{base}\\times\\text{height}$, where the height is perpendicular to the base. Example: base 6, height 4: $\\frac12\\times24=12$.",()=>{const b=R(3,20),h=2*R(2,12);return[`A triangle has base ${b} and height ${h}. Find its area.`,b*h/2]});
add(2,"Y7-8","Mean","Mean $=\\frac{\\text{sum of values}}{\\text{number of values}}$. Example: 2, 4, 9 has sum 15, so mean $=5$.",()=>{const m=R(5,40),a=R(1,4),b=R(1,4),n=[m+a,m+b,m-a,m-b,m].sort(()=>Math.random()-.5);return[`Find the mean of ${n.join(", ")}.`,m]});
add(2,"Y7-8","Simple Probability","$P=\\frac{\\text{favourable outcomes}}{\\text{total outcomes}}$, always between 0 and 1. Example: 3 red in 10 counters gives $\\frac{3}{10}$. Give a fraction or decimal.",()=>{const r=R(1,9),b=R(1,9);return[`A bag has ${r} red and ${b} blue counters. What is the probability of picking red?`,r/(r+b)]});
add(2,"Y8-9","Pythagoras","In a right triangle $a^2+b^2=c^2$, where $c$ is the longest side. To find a short side, rearrange: $b^2=c^2-a^2$. Example: 3, 4 gives $c=5$.",()=>{const[a,b]=P([[3,4],[5,12],[8,15],[7,24],[6,8]]),k=R(1,5),h=Math.hypot(a,b);return P([0,1])?[`A right triangle has shorter sides ${a*k} and ${b*k}. Find the hypotenuse.`,h*k]:[`A right triangle has hypotenuse ${h*k} and one side ${a*k}. Find the other side.`,b*k]});
// ---- Sector 3
add(3,"Y9","Expanding Brackets","Multiply every term in the first bracket by every term in the second: $(x+a)(x+b)=x^2+(a+b)x+ab$. Example: $(x+2)(x+3)=x^2+5x+6$.",()=>{const a=R(-9,9),b=R(-9,9);return P([0,1])?[`When $(x${sx(a)})(x${sx(b)})$ is expanded, what is the coefficient of $x$?`,a+b]:[`When $(x${sx(a)})(x${sx(b)})$ is expanded, what is the constant term?`,a*b]});
add(3,"Y10","Quadratic Equations","Factorise: find two numbers that multiply to the constant and add to the middle coefficient. Then set each bracket to zero. Example: $x^2-5x+6=(x-2)(x-3)=0$ so $x=2$ or $3$.",()=>{const p=R(-6,9),q=p+R(1,8);return[`Solve $x^2${sx(-(p+q))}x${sx(p*q)}=0$. Enter the larger solution.`,q]});
add(3,"Y10","Simultaneous Equations","Add or subtract the two equations to eliminate one variable, solve for the other, then substitute back. Example: $x+y=7$ and $x-y=1$ add to $2x=8$, so $x=4$.",()=>{const x=R(1,9),y=R(1,9);return[`$x+y=${x+y}$ and $x-y=${x-y}$. Find $x$.`,x]});
add(3,"Y9-10","Gradient","Gradient $m=\\frac{y_2-y_1}{x_2-x_1}$ (rise over run). Example: $(1,2)$ and $(3,8)$: $\\frac{6}{2}=3$.",()=>{const m=R(-5,6),x=R(-4,4),y=R(-5,5),d=R(1,4);return[`Find the gradient of the line through $(${x},${y})$ and $(${x+d},${y+m*d})$.`,m]});
add(3,"Y10-11","Trigonometry","SOH CAH TOA: $\\sin\\theta=\\frac{O}{H}$, $\\cos\\theta=\\frac{A}{H}$, $\\tan\\theta=\\frac{O}{A}$. Exact values: $\\sin30^\\circ=\\frac12$ and $\\cos60^\\circ=\\frac12$.",()=>{const h=2*R(2,30);return P([0,1])?[`Hypotenuse ${h}, angle 30°. Find the opposite side.`,h/2]:[`Hypotenuse ${h}, angle 60°. Find the adjacent side.`,h/2]});
add(3,"Y10-11","Indices","Same base: add powers when multiplying, subtract when dividing. $a^m\\times a^n=a^{m+n}$ and $a^m\\div a^n=a^{m-n}$. Example: $2^3\\times2^2=2^5=32$.",()=>{const b=P([2,3,5]),m=R(1,4),n=R(1,3);return P([0,1])?[`Evaluate $${b}^{${m}}\\times${b}^{${n}}$.`,b**(m+n)]:[`Evaluate $${b}^{${m+n}}\\div${b}^{${n}}$.`,b**m]});
add(3,"Y9-10","Number Patterns","A linear pattern has a common difference $d$. Term $n$ is $a_n=a_1+(n-1)d$. Example: 3, 7, 11, … has $d=4$, so term 10 is $3+9\\times4=39$.",()=>{const a=R(1,20),d=R(2,9),n=R(10,40);return[`Sequence: ${a}, ${a+d}, ${a+2*d}, … Find term number ${n}.`,a+(n-1)*d]});
add(3,"Y11","Compound Interest","$A=P\\left(1+\\frac{r}{100}\\right)^t$. Multiply by $(1+r/100)$ once per year. Example: 1000 at 10% for 2 years: $1000\\times1.1^2=1210$.",()=>{const p=R(1,9)*1000,r=P([10,20]),t=R(1,3);return[`${p} dollars earns ${r}% compound interest for ${t} year${t>1?"s":""}. Find the final amount.`,Math.round(p*(1+r/100)**t)]});
add(3,"Y10-11","Volume of Cylinders","$V=\\pi r^2h$: area of the circular base times the height. Example: $r=2,h=5$ gives $V=20\\pi$, so $k=20$.",()=>{const r=R(2,9),h=R(2,15);return[`A cylinder has radius ${r} and height ${h}. Its volume is $k\\pi$. Find $k$.`,r*r*h]});
add(3,"Y11","Circle Theorems","The angle at the centre is double the angle at the circumference when both stand on the same arc. Example: 35° at the edge means 70° at the centre.",()=>{const a=R(15,80);return[`The angle at the circumference is ${a}°. Find the angle at the centre on the same arc.`,2*a]});
add(3,"Y11","Independent Probability","For independent events multiply: $P(A\\text{ and }B)=P(A)\\times P(B)$. Example: two heads in a row is $\\frac12\\times\\frac12=\\frac14$. Give a fraction or decimal.",()=>{if(P([0,1])){const n=R(2,5);return[`A fair coin is tossed ${n} times. What is the probability of all heads?`,1/2**n]}const a=R(2,9),b=R(2,9);return[`Independent events have P(A) = ${a/10} and P(B) = ${b/10}. Find P(A and B).`,a*b/100]});
add(3,"Y9-10","Standard Form","Write numbers as $a\\times10^k$ with $1\\le a<10$. $k$ is how many places the decimal point moved. Example: $45000=4.5\\times10^4$.",()=>{const j=R(0,6),m=R(11,99);return[`${m*10**j} = a × 10^k in standard form. Find k.`,j+1]});
// ---- Sector 4
add(4,"Y12-13","Differentiation","Power rule: $\\frac{d}{dx}(ax^n)=nax^{n-1}$. Differentiate, then substitute the $x$-value to get the gradient. Example: $f=3x^2$, $f'=6x$, $f'(2)=12$.",()=>{const a=R(1,6),n=R(2,5),k=R(1,4);return[`If $f(x)=${a}x^{${n}}$, find $f'(${k})$.`,a*n*k**(n-1)]});
add(4,"Y13","Integration","$\\int ax^n\\,dx=\\frac{a}{n+1}x^{n+1}$. For a definite integral, evaluate at the upper limit minus the lower limit. Example: $\\int_0^2 3x^2dx=[x^3]_0^2=8$.",()=>{const n=R(1,3),m=R(1,5),k=R(1,4);return[`Evaluate $\\int_0^{${k}} ${(n+1)*m}x^{${n}}\\,dx$.`,m*k**(n+1)]});
add(4,"Y13","Complex Numbers","$i^2=-1$. Multiply like brackets: $(a+bi)(c+di)=(ac-bd)+(ad+bc)i$. Example: $(1+2i)(3+i)=1+7i$.",()=>{const a=R(1,6),b=R(1,6),c=R(1,6),d=R(1,6),im=P([0,1]);return[`Find the ${im?"imaginary":"real"} part of $(${a}+${b}i)(${c}+${d}i)$.`,im?a*d+b*c:a*c-b*d]});
add(4,"Y12","Logarithms","$\\log_b x$ asks: what power of $b$ gives $x$? $\\log_b b^n=n$ and $\\log_bx+\\log_by=\\log_b(xy)$. Example: $\\log_28=3$.",()=>{const b=P([2,3,5]),m=R(1,4),n=R(1,4);return[`Evaluate $\\log_{${b}} ${b**m}+\\log_{${b}} ${b**n}$.`,m+n]});
add(4,"Y12-13","Expected Value","$E(X)=\\sum x\\cdot P(X=x)$: multiply each value by its probability and add. Example: values 1, 2 with probabilities 0.4, 0.6 give $0.4+1.2=1.6$.",()=>{const a=R(1,4),b=R(1,5),c=10-a-b;return[`X takes values 1, 2, 3 with probabilities ${a/10}, ${b/10}, ${c/10}. Find E(X).`,(a+2*b+3*c)/10]});
add(4,"Y12","Arithmetic Series","$S_n=\\frac n2\\,(2a+(n-1)d)$. Example: 2, 5, 8, … first 4 terms: $2\\times(4+9)=26$.",()=>{const a=R(1,9),d=R(1,6),n=2*R(3,9);return[`Find the sum of the first ${n} terms of ${a}, ${a+d}, ${a+2*d}, …`,n/2*(2*a+(n-1)*d)]});
add(4,"Y13","Geometric Series","If $|r|<1$ the infinite sum is $S_\\infty=\\frac{a}{1-r}$. Example: $4+2+1+\\dots$ has $a=4,r=\\frac12$, so $S_\\infty=8$.",()=>{const m=R(1,9);return P([0,1])?[`Sum to infinity of ${2*m} + ${m} + ${m/2} + …`,4*m]:[`Sum to infinity of ${3*m} + ${m} + ${m}/3 + …`,4.5*m]});
// ---- Sector 5
add(5,"NZMO","Modular Arithmetic","Reduce the base mod $m$, then find the cycle of powers. $7^{100}\\bmod5$: $7\\equiv2$, $2^4=16\\equiv1$, and $100=4\\times25$, so the remainder is $1$.",()=>{const b=R(2,9),e=R(10,200),m=P([3,5,7,11]);return[`Find the remainder when ${b}^${e} is divided by ${m}.`,mp(b,e,m)]});
add(5,"NZMO","Number of Divisors","If $n=p^aq^br^c$, the number of divisors is $(a+1)(b+1)(c+1)$, since each exponent can be 0 up to its maximum. Example: $12=2^2\\cdot3$ has $3\\times2=6$ divisors.",()=>{const a=R(1,6),b=R(1,5),c=R(0,3);return[`How many positive divisors does $2^{${a}}\\cdot3^{${b}}\\cdot5^{${c}}$ have?`,(a+1)*(b+1)*(c+1)]});
add(5,"NZMO","Combinations","When order doesn't matter, $\\binom nk=\\frac{n!}{k!(n-k)!}$. Handshakes among $n$ people is $\\binom n2$. Example: $\\binom52=10$.",()=>{const n=R(6,14),k=R(2,5);return[`In how many ways can ${k} people be chosen from ${n}?`,C(n,k)]});
add(5,"NZMO","Arrangements","Arranging $n$ letters where some repeat: $\\frac{n!}{a!\\,b!\\cdots}$ (divide by the factorial of each repeat count). Example: BANANA: $\\frac{6!}{3!\\,2!}=60$.",()=>{const w=P(["BANANA","LEVEL","ALGEBRA","PEPPER","TOOTH","SUCCESS","BALLOON","COOKIE","ANAGRAM","MATHEMATICS"]),c={};for(const l of w)c[l]=(c[l]||0)+1;return[`How many distinct arrangements are there of the letters of ${w}?`,Object.values(c).reduce((a,v)=>a/fact(v),fact(w.length))]});
add(5,"IMO","Vieta's Formulas","For roots $a,b$ of $x^2-sx+p=0$: $a+b=s$ and $ab=p$. Symmetric expressions follow: $a^2+b^2=(a+b)^2-2ab$.",()=>{const s=R(2,12),p=R(-8,15);return[`If $a+b=${s}$ and $ab=${p}$, find $a^2+b^2$.`,s*s-2*p]});
add(5,"NZMO","Last Digits","The units digit is the remainder mod 10, and powers cycle in length 4 or less. Example: $7^1,7^2,7^3,7^4$ end in 7, 9, 3, 1, then repeat.",()=>{const b=R(2,19),e=R(5,100);return[`Find the units digit of ${b}^${e}.`,mp(b,e,10)]});
add(5,"NZMO","Polygon Angles","Exterior angles of a convex polygon sum to $360^\\circ$, so a regular $n$-gon has exterior angle $\\frac{360}{n}$. Example: hexagon: $60^\\circ$.",()=>{const n=P([5,6,8,9,10,12,15,18,20,24,30,36,40,45,60,72]);return P([0,1])?[`A regular polygon has ${n} sides. Find one exterior angle in degrees.`,360/n]:[`A regular polygon has exterior angle ${360/n}°. How many sides does it have?`,n]});
add(5,"IMO","AM-GM Inequality","For positive $u,v$: $\\frac{u+v}{2}\\ge\\sqrt{uv}$, with equality when $u=v$. So $cx+\\frac{cm^2}{x}\\ge2\\sqrt{c^2m^2}=2cm$.",()=>{const c=R(1,5),m=R(2,12);return[`Find the minimum of $${c}x+\\frac{${c*m*m}}{x}$ for $x>0$.`,2*c*m]});
add(5,"IMO","Heron's Formula","With semi-perimeter $s=\\frac{a+b+c}{2}$, area $=\\sqrt{s(s-a)(s-b)(s-c)}$. Example: 5, 12, 13: $s=15$, area $=\\sqrt{15\\cdot10\\cdot3\\cdot2}=30$.",()=>{const[a,b,c,A]=P([[13,14,15,84],[5,12,13,30],[17,25,28,210],[9,10,17,36],[7,15,20,42]]),k=R(1,3);return[`A triangle has sides ${a*k}, ${b*k}, ${c*k}. Find its area.`,A*k*k]});

const gcd=(a,b)=>b?gcd(b,a%b):a;
// ---- More Sector 1 (NZC Levels 1-3)
add(1,"Y1-2","Skip Counting","Count in equal jumps. Add the same number each time: 5, 10, 15, … goes up by 5.",()=>{const d=P([2,3,4,5,10]),a=d*R(1,6);return[`${a}, ${a+d}, ${a+2*d}, ${a+3*d}, ?`,a+4*d]});
add(1,"Y2-4","Money & Change","Change = amount paid − total cost. Pay 20 for 13 and you get 7 back.",()=>{const p=P([10,20,50,100]),c=R(3,p-1);return[`You pay with a ${p}-dollar note for an item costing ${c} dollars. How many dollars change?`,p-c]});
add(1,"Y2-4","Time","1 hour = 60 minutes. Multiply hours by 60, then add the extra minutes. 2 h 15 min is 135 min.",()=>{const h=R(1,6),m=R(1,59);return[`How many minutes in ${h} hours and ${m} minutes?`,h*60+m]});
add(1,"Y2-4","Shapes: Faces, Edges, Vertices","Count flat faces, edges where faces meet, and corner points (vertices). A cube has 6 faces, 12 edges, 8 vertices.",()=>{const[n,f,e,v]=P([["cube",6,12,8],["cuboid",6,12,8],["square-based pyramid",5,8,5],["triangular prism",5,9,6],["triangular pyramid",4,6,4],["hexagonal prism",8,18,12],["pentagonal prism",7,15,10]]),k=R(0,2);return[`How many ${["faces","edges","vertices"][k]} does a ${n} have?`,[f,e,v][k]]});
add(1,"Y3-5","Rounding","Look at the digit to the right of the place you are rounding to: 5 or more rounds up, 4 or less stays.",()=>{const n=R(1001,9999),d=P([10,100]);return[`Round ${n} to the nearest ${d}.`,Math.round(n/d)*d]});
add(1,"Y4-5","Equivalent Fractions","Multiply top and bottom by the same number. $\\frac12=\\frac24=\\frac36$.",()=>{const a=R(1,5),b=R(a+1,9),k=R(2,9);return[`$\\frac{${a}}{${b}}=\\frac{?}{${b*k}}$. Find the missing numerator.`,a*k]});
add(1,"Y5-6","Factors & Multiples","HCF: biggest number dividing both. LCM: smallest number both divide into. For 4 and 6: HCF 2, LCM 12.",()=>{const g=R(2,9),a=R(2,6),b=R(2,6);return P([0,1])?[`Find the highest common factor of ${g*a} and ${g*b}.`,g*gcd(a,b)]:[`Find the lowest common multiple of ${a*2} and ${b*3}.`,a*2*b*3/gcd(a*2,b*3)]});
add(1,"Y5-6","Squares, Cubes & Roots","$n^2=n\\times n$, $n^3=n\\times n\\times n$, and a root undoes a power: $\\sqrt{49}=7$.",()=>{const m=R(2,12);return P([0,1])?[`Evaluate $\\sqrt{${m*m}}$.`,m]:[`Evaluate $${m}^3$.`,m**3]});
add(1,"Y5-6","Volume of Cuboids","Volume = length × width × height (cubic units).",()=>{const l=R(2,12),w=R(2,10),h=R(2,9);return[`A cuboid is ${l} by ${w} by ${h}. Find its volume.`,l*w*h]});
add(1,"Y6","Speed, Distance & Time","Distance = speed × time. Rearrange: speed = distance ÷ time, time = distance ÷ speed.",()=>{const s=R(2,15)*5,t=R(2,8);return P([[`A car travels at ${s} km/h for ${t} hours. How many km?`,s*t],[`A car travels ${s*t} km in ${t} hours. Average speed in km/h?`,s],[`How many hours to travel ${s*t} km at ${s} km/h?`,t]])});
add(1,"Y3-6","Median & Range","Order the data. The median is the middle value; range = largest − smallest.",()=>{const d=Array.from({length:5},()=>R(1,30)),s=[...d].sort((a,b)=>a-b);return P([0,1])?[`Find the median of ${d.join(", ")}.`,s[2]]:[`Find the range of ${d.join(", ")}.`,s[4]-s[0]]});
add(1,"Y5-6","Coordinates","Move right or up by adding to $x$ or $y$. (2,3) moved 4 right and 1 up becomes (6,4).",()=>{const x=R(0,9),y=R(0,9),a=R(1,6),b=R(1,6);return[`Point (${x}, ${y}) moves ${a} right and ${b} up. What is the sum of the new coordinates?`,x+y+a+b]});
// ---- More Sector 2
add(2,"Y7-8","Add & Subtract Fractions","Make the denominators equal first. $\\frac12+\\frac13=\\frac36+\\frac26=\\frac56$. Give a fraction or decimal.",()=>{const a=P([2,3,4,5,6]),b=P([2,3,4,5,6,8]);const x=R(1,a-1),y=R(1,b-1);return[`$\\frac{${x}}{${a}}+\\frac{${y}}{${b}}$ (fraction or decimal)`,x/a+y/b]});
add(2,"Y7-8","Multiply & Divide Fractions","Multiply tops and bottoms. To divide, flip the second fraction and multiply. $\\frac23\\times\\frac34=\\frac12$.",()=>{const a=R(1,5),b=R(a+1,8),c=R(1,5),d=R(c+1,8);return P([0,1])?[`$\\frac{${a}}{${b}}\\times\\frac{${c}}{${d}}$ (fraction or decimal)`,a*c/(b*d)]:[`$\\frac{${a}}{${b}}\\div\\frac{${c}}{${d}}$ (fraction or decimal)`,a*d/(b*c)]});
add(2,"Y8","GST & Percent Increase","Increase by $p\\%$: multiply by $1+\\frac{p}{100}$. NZ GST is 15%, so multiply by 1.15.",()=>{const n=R(2,40)*20,p=P([10,15,20,25,50]);return[`Increase ${n} by ${p}%.`,n*(100+p)/100]});
add(2,"Y8","Simplifying Expressions","Collect like terms. $3x+5-x+2=2x+7$.",()=>{const a=R(2,9),b=R(1,9),c=R(1,a-1),d=R(1,9);return P([0,1])?[`Simplify $${a}x+${b}-${c}x+${d}$. What is the coefficient of $x$?`,a-c]:[`Simplify $${a}x+${b}-${c}x+${d}$. What is the constant term?`,b+d]});
add(2,"Y8-9","Expanding One Bracket","Multiply everything inside by the outside number. $3(2x+5)=6x+15$.",()=>{const a=R(2,9),b=R(2,9),c=R(1,9);return P([0,1])?[`Expand $${a}(${b}x+${c})$. Coefficient of $x$?`,a*b]:[`Expand $${a}(${b}x+${c})$. Constant term?`,a*c]});
add(2,"Y7-8","Unitary Method","Find the cost of one first, then multiply. 4 pens cost 12, so 1 pen costs 3.",()=>{const n=R(2,9),u=R(2,15),m=R(2,20);return[`${n} items cost ${n*u} dollars. How many dollars do ${m} items cost?`,u*m]});
add(2,"Y7-8","Prime Factors","Break a number into primes: $12=2\\times2\\times3$. Count every factor, including repeats.",()=>{const a=R(1,5),b=R(0,3),c=R(0,2);return[`Write ${2**a*3**b*5**c} as a product of primes. How many prime factors are there (counting repeats)?`,a+b+c]});
add(2,"Y8","Circles","Circumference $=2\\pi r$, area $=\\pi r^2$. Leave answers in terms of $\\pi$.",()=>{const r=R(2,15);return P([0,1])?[`Radius ${r}. Circumference is $k\\pi$. Find $k$.`,2*r]:[`Radius ${r}. Area is $k\\pi$. Find $k$.`,r*r]});
add(2,"Y8","Volume of Prisms","Volume = cross-section area × length. For a triangle: $\\frac12bh\\times L$.",()=>{const b=R(2,12),h=2*R(1,6),L=R(2,12);return[`A triangular prism has triangle base ${b}, triangle height ${h}, and length ${L}. Find its volume.`,b*h/2*L]});
add(2,"Y8","Angles & Parallel Lines","Corresponding and alternate angles are equal; co-interior angles add to $180^\\circ$.",()=>{const a=R(30,150);return P([0,1])?[`Two parallel lines are cut by a transversal. One angle is ${a}°. Find its alternate angle.`,a]:[`Find the co-interior angle to ${a}° between parallel lines.`,180-a]});
add(2,"Y8","Reflections","Reflect in the $y$-axis: $x\\to-x$. Reflect in the $x$-axis: $y\\to-y$.",()=>{const x=R(1,9),y=R(1,9);return P([0,1])?[`Reflect (${x}, ${y}) in the y-axis. What is the new x-coordinate?`,-x]:[`Reflect (${x}, ${y}) in the x-axis. What is the new y-coordinate?`,-y]});
add(2,"Y8","Scale Drawings","Multiply the map distance by the scale. If 1 cm is 5 km, then 4 cm is 20 km.",()=>{const k=R(2,25),d=R(2,30);return[`On a map 1 cm represents ${k} km. A route measures ${d} cm. How many km is it?`,k*d]});
add(2,"Y8","Counting Outcomes","Multiply the choices. 3 shirts and 4 pants give $3\\times4=12$ outfits.",()=>{const a=R(2,6),b=R(2,8),c=R(2,5);return[`A menu has ${a} mains, ${b} sides and ${c} drinks. How many different meals (one of each)?`,a*b*c]});
// ---- More Sector 3 (NCEA Level 1) with achievement standard codes
add(3,"Y9-10","Common Factors","Take out the biggest number dividing every term. $6x+9=3(2x+3)$, factor 3.",()=>{const g=R(2,9),[a,b]=P([[2,3],[3,4],[2,5],[3,5],[4,5],[1,3],[2,7]]);return[`Factorise $${g*a}x+${g*b}$ by taking out the largest common factor. What is that factor?`,g]},"91027");
add(3,"Y10-11","Difference of Two Squares","$x^2-n^2=(x-n)(x+n)$.",()=>{const n=R(2,15);return[`$x^2-${n*n}=(x-n)(x+n)$. Find $n$.`,n]},"91027");
add(3,"Y10-11","Rearranging Formulae","Undo operations in reverse. From $y=mx+c$ we get $x=\\frac{y-c}{m}$.",()=>{const m=R(2,9),x=R(1,12),c=R(1,20);return[`If $y=${m}x+${c}$ and $y=${m*x+c}$, find $x$.`,x]},"91027 91029");
add(3,"Y10-11","Linear Inequalities","Solve like an equation, but flip the sign if you multiply or divide by a negative. $2x+1\\le9\\Rightarrow x\\le4$.",()=>{const a=R(2,9),b=R(1,15),x=R(-4,12);return[`Solve $${a}x+${b}\\le${a*x+b}$. What is the largest integer $x$?`,x]},"91029");
add(3,"Y10-11","Equation of a Line","$y=mx+c$: $m$ is the gradient and $c$ the $y$-intercept. Use a known point: $c=y-mx$.",()=>{const m=R(-5,6),x=R(1,6),y=R(-8,12);return[`A line with gradient ${m} passes through (${x}, ${y}). Find its y-intercept.`,y-m*x]},"91028 91256");
add(3,"Y10-11","Equations with Fractions","Undo the division last: multiply both sides by the denominator. $\\frac x3+2=5\\Rightarrow x=9$.",()=>{const a=R(2,9),b=R(1,9),c=R(b+1,b+9);return[`Solve $\\frac{x}{${a}}+${b}=${c}$.`,a*(c-b)]},"91029");
add(3,"Y10-11","Direct Proportion","If $y\\propto x$ then $y=kx$. Find $k$ from the first pair, then use it.",()=>{const k=R(2,9),x1=R(2,8),x2=R(9,20);return[`$y$ is directly proportional to $x$. When $x=${x1}$, $y=${k*x1}$. Find $y$ when $x=${x2}$.`,k*x2]},"91026 91028");
add(3,"Y10-11","Reverse Percentages","If a price rose by $p\\%$, divide the new price by $1+\\frac{p}{100}$ to get the original.",()=>{const n=R(1,20)*20,p=P([10,20,25,50]);return[`After a ${p}% increase a price is ${n*(100+p)/100} dollars. What was the original price in dollars?`,n]},"91026");
add(3,"Y11","Surds","Pull out perfect squares. $\\sqrt{18}=\\sqrt{9\\times2}=3\\sqrt2$.",()=>{const m=R(2,9),n=P([2,3,5,6,7]);return[`$\\sqrt{${m*m*n}}=m\\sqrt{${n}}$. Find $m$.`,m]},"91027 91261");
add(3,"Y10-11","Similar Shapes","Similar shapes have scale factor $k$ for lengths and $k^2$ for areas.",()=>{const k=R(2,5),a=R(2,12);return P([0,1])?[`Two similar shapes have scale factor ${k}. A side of the small shape is ${a}. How long is the matching side of the large shape?`,a*k]:[`Two similar shapes have scale factor ${k}. The small one has area ${a}. Find the area of the large one.`,a*k*k]},"91031");
add(3,"Y10-11","Bearings","Bearings are measured clockwise from north using 3 digits. The back bearing differs by $180^\\circ$.",()=>{const b=R(10,179)+P([0,180]);return[`The bearing of B from A is ${b}°. What is the bearing of A from B?`,b<180?b+180:b-180]},"91032 91031");
add(3,"Y10-11","Right-Triangle Ratios","Find the missing side with Pythagoras, then write the ratio (SOH CAH TOA). Give a fraction or decimal.",()=>{const[o,a,h]=P([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]]),k=R(1,4),t=R(0,2);return[`A right triangle has sides ${o*k}, ${a*k}, ${h*k} (hypotenuse longest). Find ${["sin","cos","tan"][t]} of the angle opposite the side of length ${o*k}.`,[o/h,a/h,o/a][t]]},"91032");
add(3,"Y9-10","Interior Angles of Polygons","Interior angle sum $=(n-2)\\times180^\\circ$. For a regular polygon divide by $n$.",()=>{const n=R(5,12),m=P([6,8,10,12]);return P([0,1])?[`What is the sum of the interior angles of a ${n}-sided polygon?`,(n-2)*180]:[`Find one interior angle of a regular ${m}-sided polygon.`,(m-2)*180/m]},"91031 91033");
add(3,"Y10-11","Quartiles & IQR","Order the data and split it into halves. Q1 and Q3 are the medians of the halves. IQR $=Q_3-Q_1$.",()=>{const d=Array.from({length:8},()=>R(1,40)).sort((a,b)=>a-b);return[`Find the interquartile range of ${d.join(", ")}.`,(d[5]+d[6])/2-(d[1]+d[2])/2]},"91035 91036");
add(3,"Y11","Two-Way Probability","Without replacement the second probability changes: $P(RR)=\\frac{r}{t}\\times\\frac{r-1}{t-1}$. Give a fraction or decimal.",()=>{const r=R(2,8),b=R(1,8);return[`A bag has ${r} red and ${b} blue counters. Two are drawn without replacement. What is the probability both are red?`,r/(r+b)*(r-1)/(r+b-1)]},"91037 91038");
add(3,"Y10-11","Surface Area","Cuboid surface area $=2(lw+lh+wh)$.",()=>{const l=R(2,12),w=R(2,10),h=R(2,9);return[`Find the surface area of a ${l} by ${w} by ${h} cuboid.`,2*(l*w+l*h+w*h)]},"91030");
add(3,"Y11","Cones & Spheres","Sphere $V=\\frac43\\pi r^3$, cone $V=\\frac13\\pi r^2h$. Leave answers in terms of $\\pi$.",()=>{const m=R(1,4),r=R(2,6),h=3*R(1,5);return P([0,1])?[`A sphere has radius ${3*m}. Its volume is $k\\pi$. Find $k$.`,36*m**3]:[`A cone has radius ${r} and height ${h}. Its volume is $k\\pi$. Find $k$.`,r*r*h/3]},"91030");
add(3,"Y11","Enlargement & Rotation","Enlarging from the origin multiplies both coordinates by the scale factor. Rotating 180° about the origin negates both.",()=>{const x=R(1,9),y=R(1,9),k=R(2,5);return P([0,1])?[`Enlarge (${x}, ${y}) from the origin with scale factor ${k}. Find the sum of the new coordinates.`,k*(x+y)]:[`Rotate (${x}, ${y}) by 180° about the origin. Find the new x-coordinate.`,-x]},"91034");
add(3,"Y11","Line of Best Fit","Substitute into the line to predict $y$. Interpolate inside the data range, not far outside it.",()=>{const m=R(2,9),c=R(1,30),x=R(2,20);return[`A line of best fit is $y=${m}x+${c}$. Predict $y$ when $x=${x}$.`,m*x+c]},"91036");
add(3,"Y10-11","Compound Measures","Density $=\\frac{m}{V}$. To change km/h to m/s multiply by $\\frac{1000}{3600}=\\frac{5}{18}$.",()=>{const k=R(1,12),v=R(2,9),d=R(2,9);return P([0,1])?[`Convert ${18*k} km/h to m/s.`,5*k]:[`A block of volume ${v} cm³ has mass ${v*d} g. Find its density in g/cm³.`,d]},"91030");
// ---- More Sector 4: NCEA Level 2 (Y12) and Level 3 (Y13)
add(4,"Y12","Midpoint & Distance","Midpoint $=(\\frac{x_1+x_2}{2},\\frac{y_1+y_2}{2})$. Distance $=\\sqrt{\\Delta x^2+\\Delta y^2}$.",()=>{if(P([0,1])){const a=R(-6,6),c=a+2*R(1,6);return[`Find the x-coordinate of the midpoint of (${a}, 1) and (${c}, 5).`,(a+c)/2]}const[p,q]=P([[3,4],[5,12],[8,15]]),k=R(1,3),x=R(-4,4),y=R(-4,4);return[`Find the distance between (${x}, ${y}) and (${x+p*k}, ${y+q*k}).`,Math.hypot(p,q)*k]},"91256");
add(4,"Y12","Perpendicular Gradients","Perpendicular lines have gradients with product $-1$: $m_2=-\\frac{1}{m_1}$.",()=>{const m=P([2,4,5,8,10,-2,-4,-5,-8,-10]);return[`A line has gradient ${m}. Find the gradient of a perpendicular line.`,-1/m]},"91256");
add(4,"Y12","Quadratic Graphs","$y=x^2-2hx+c=(x-h)^2+c-h^2$ has its vertex at $(h,\\,c-h^2)$.",()=>{const h=R(-6,8),c=R(-5,12);return[`Find the y-coordinate of the vertex of $y=x^2${sx(-2*h)}x${sx(c)}$.`,c-h*h]},"91257");
add(4,"Y12","Transforming Graphs","$y=f(x-a)+b$ shifts the graph of $y=f(x)$ right $a$ and up $b$.",()=>{const p=R(-5,5),q=R(-5,5),a=R(-4,6),b=R(-4,6);return P([0,1])?[`(${p}, ${q}) is on y=f(x). Its image on y=f(x${sx(-a)})${sx(b)} has what x-coordinate?`,p+a]:[`(${p}, ${q}) is on y=f(x). Its image on y=f(x${sx(-a)})${sx(b)} has what y-coordinate?`,q+b]},"91257");
add(4,"Y12","Geometric Sequences","Each term multiplies by $r$: $u_n=ar^{n-1}$.",()=>{const a=R(1,6),r=R(2,4),n=R(3,7);return[`Geometric sequence: ${a}, ${a*r}, ${a*r*r}, … Find term ${n}.`,a*r**(n-1)]},"91258");
add(4,"Y12","Area with Sine","Triangle area $=\\frac12ab\\sin C$. $\\sin30^\\circ=\\frac12$, $\\sin90^\\circ=1$, $\\sin150^\\circ=\\frac12$.",()=>{const a=2*R(1,8),b=2*R(1,8),C=P([30,90,150]);return[`A triangle has sides ${a} and ${b} enclosing an angle of ${C}°. Find its area.`,.5*a*b*(C===90?1:.5)]},"91259");
add(4,"Y12","Radians & Arc Length","$180^\\circ=\\pi$ radians. Arc length $=r\\theta$ with $\\theta$ in radians.",()=>{const m=R(1,6),d=P([30,60,90,120,180]);return[`A circle has radius ${6*m}. An arc subtends ${d}° at the centre. The arc length is $k\\pi$. Find $k$.`,m*d/30]},"91259 91575");
add(4,"Y12","Network Methods","Minimum spanning tree: keep adding the cheapest edge that makes no loop until all vertices are joined. Planar networks: $V-E+F=2$.",()=>{if(P([0,1])){const V=R(4,12),E=R(V,V+8);return[`A connected planar network has ${V} vertices and ${E} edges. How many faces (including the outer face)?`,2-V+E]}const nm=["AB","AC","AD","BC","BD","CD"],w=nm.map(()=>R(1,15)),ix=[...w.keys()].sort((x,y)=>w[x]-w[y]),p={A:"A",B:"B",C:"C",D:"D"},f=x=>p[x]===x?x:f(p[x]);let t=0;for(const i of ix){const u=f(nm[i][0]),v=f(nm[i][1]);if(u!==v){p[u]=v;t+=w[i]}}return[`Four towns are linked by roads with costs ${nm.map((n,i)=>n+"="+w[i]).join(", ")}. What is the minimum total cost to connect all four towns?`,t]},"91260");
add(4,"Y12","Quadratic Formula & Discriminant","For $ax^2+bx+c=0$ the discriminant is $\\Delta=b^2-4ac$. $\\Delta>0$: two roots; $\\Delta=0$: one root; $\\Delta<0$: none.",()=>{const a=R(1,5),b=R(-9,9),c=R(-6,8);return[`Find the discriminant of $${a}x^2${sx(b)}x${sx(c)}=0$.`,b*b-4*a*c]},"91261");
add(4,"Y12","Exponential Equations","Write both sides with the same base, then equate powers. $2^x=32=2^5$ so $x=5$.",()=>{const b=P([2,3,4,5,10]),x=R(2,6);return[`Solve $${b}^x=${b**x}$.`,x]},"91261");
add(4,"Y12","Rational Equations","Multiply through by the denominator. $\\frac{12}{x-2}=3\\Rightarrow x-2=4\\Rightarrow x=6$.",()=>{const b=R(2,9),k=R(1,9);return[`Solve $\\frac{${b*k}}{x-2}=${b}$.`,k+2]},"91261");
add(4,"Y12","Stationary Points","At a stationary point $f'(x)=0$. For $f=ax^2+bx$: $f'=2ax+b=0$, so $x=-\\frac{b}{2a}$.",()=>{const a=R(1,5),x=R(-6,8);return[`Find the x-value of the stationary point of $f(x)=${a}x^2${sx(-2*a*x)}x$.`,x]},"91262");
add(4,"Y12","Questionnaire Design (Knowledge Check)","Good questions are clear, unbiased and about one idea. Non-response shrinks the usable sample. This activity checks only the numeric side; the design task itself is assessed by your teacher.",()=>{const n=R(2,20)*50,r=P([40,50,60,70,80]);return[`A questionnaire is sent to ${n} people with a ${r}% response rate. How many responses come back?`,n*r/100]},"91263");
add(4,"Y12","Margin of Error","For a sample of size $n$ the margin of error for a percentage is about $\\frac{1}{\\sqrt n}\\times100$ percentage points.",()=>{const n=P([25,100,400,625,900,1600,2500,10000,64,144,196,256]);return[`Approximate margin of error (percentage points) for a sample of ${n}.`,100/Math.sqrt(n)]},"91264");
add(4,"Y12","Experiment Design (Knowledge Check)","Allocate subjects to treatments at random. The number of ways to choose who gets a treatment is $\\binom nk$. This checks only the counting side.",()=>{const n=R(5,12),k=R(2,4);return[`In how many ways can ${k} of ${n} subjects be chosen for the treatment group?`,C(n,k)]},"91265");
add(4,"Y12","Evaluating Reports (Knowledge Check)","Check claims with numbers: percentage change $=\\frac{\\text{new}-\\text{old}}{\\text{old}}\\times100$. This checks only the calculation side.",()=>{const o=R(2,20)*20,p=P([10,20,25,50,5,15]);return[`A report says a count rose from ${o} to ${o*(100+p)/100}. What is the percentage increase?`,p]},"91266");
add(4,"Y12","Venn Diagrams & Conditional Probability","$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$ and $P(A|B)=\\frac{P(A\\cap B)}{P(B)}$. Give a fraction or decimal.",()=>{const c=R(1,6),a=R(c,c+8),b=R(c,c+8),t=a+b-c+R(1,10);return P([0,1])?[`Out of ${t} students, ${a} like A, ${b} like B and ${c} like both. Find P(A or B).`,(a+b-c)/t]:[`${b} students like B and ${c} of them also like A. Find P(A given B).`,c/b]},"91267");
add(4,"Y12","Simulation (Knowledge Check)","A simulation repeats a random trial many times. Expected successes $=n\\times p$. This checks only the expectation side.",()=>{const n=R(2,20)*50,p=P([.1,.2,.25,.3,.4,.5]);return[`A simulation has ${n} trials with success probability ${p}. How many successes are expected?`,n*p]},"91268");
add(4,"Y12","Systems of Equations","Eliminate a variable. If $2p+3b=A$ and $p+3b=B$, subtracting gives $p=A-B$.",()=>{const p=R(2,9),b=R(2,9);return[`2 pens and 3 books cost ${2*p+3*b} dollars. 1 pen and 3 books cost ${p+3*b} dollars. How many dollars is one pen?`,p]},"91269 91587");
add(4,"Y13","Conic Sections","Circle: $(x-h)^2+(y-k)^2=r^2$. Parabola $y^2=4ax$ has focus $(a,0)$. Ellipse $\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$ has foci at $\\pm c$ where $c^2=a^2-b^2$.",()=>{const t=R(0,2);if(t===0){const r=R(2,12),h=R(-5,5),k=R(-5,5);return[`Find the radius of $(x${sx(-h)})^2+(y${sx(-k)})^2=${r*r}$.`,r]}if(t===1){const a=R(1,9);return[`The parabola $y^2=${4*a}x$ has focus $(a,0)$. Find $a$.`,a]}const[a,b,c]=P([[5,3,4],[5,4,3],[13,5,12],[10,6,8],[17,8,15]]),k=R(1,3);return[`Ellipse $\\frac{x^2}{${(a*k)**2}}+\\frac{y^2}{${(b*k)**2}}=1$. Find $c$, the distance from the centre to a focus.`,c*k]},"91573");
add(4,"Y13","Linear Programming","Evaluate the objective function at every vertex of the feasible region. The maximum or minimum occurs at a vertex.",()=>{const a=R(1,6),b=R(1,6),v=Array.from({length:4},()=>[R(0,10),R(0,10)]);return[`Maximise $P=${a}x+${b}y$ over the vertices ${v.map(p=>"("+p+")").join(", ")}.`,Math.max(...v.map(p=>a*p[0]+b*p[1]))]},"91574");
add(4,"Y13","Trig Identities","$\\sin2\\theta=2\\sin\\theta\\cos\\theta$ and $\\cos2\\theta=\\cos^2\\theta-\\sin^2\\theta$. Draw a right triangle to get the ratios. Give a fraction or decimal.",()=>{const[o,a,h]=P([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,35,37],[28,45,53]]);return P([0,1])?[`If $\\sin\\theta=\\frac{${o}}{${h}}$ with $\\theta$ acute, find $\\sin2\\theta$.`,2*o*a/(h*h)]:[`If $\\sin\\theta=\\frac{${o}}{${h}}$ with $\\theta$ acute, find $\\cos2\\theta$.`,(a*a-o*o)/(h*h)]},"91575");
add(4,"Y13","Critical Path Analysis","The critical path is the longest path through the project, so total time is the sum along it. Float on a shorter parallel task is the difference in lengths.",()=>{const a=R(1,6),b=R(2,9),c=R(2,9),d=R(1,6);return P([0,1])?[`Task A (${a} days) is followed by B (${b} days) and C (${c} days) in parallel, then D (${d} days). What is the minimum project time in days?`,a+Math.max(b,c)+d]:[`Tasks B (${b} days) and C (${c} days) run in parallel. What is the float of the shorter one, in days?`,Math.abs(b-c)]},"91576");
add(4,"Y13","Complex Numbers: Modulus & Powers","$|a+bi|=\\sqrt{a^2+b^2}$. $(1+i)^4=-4$. To divide, multiply by the conjugate.",()=>{const t=R(0,2);if(t===0){const[p,q]=P([[3,4],[5,12],[8,15]]),k=R(1,3);return[`Find $|${p*k}+${q*k}i|$.`,Math.hypot(p,q)*k]}if(t===1){const k=R(1,4);return[`Find the real part of $(1+i)^{${4*k}}$.`,(-4)**k]}const a=R(1,9),b=a+2*R(0,4);return[`Find the real part of $\\frac{${a}+${b}i}{1+i}$.`,(a+b)/2]},"91577");
add(4,"Y13","Differentiation Techniques","Chain rule: $\\frac{d}{dx}(ax+b)^n=na(ax+b)^{n-1}$. Also $\\frac{d}{dx}e^{kx}=ke^{kx}$.",()=>{if(P([0,1])){const a=R(2,5),b=R(1,5),n=R(2,4),k=R(1,3);return[`Find the gradient of $y=(${a}x+${b})^{${n}}$ at $x=${k}$.`,n*a*(a*k+b)**(n-1)]}const k=R(2,9);return[`Find $\\frac{dy}{dx}$ at $x=0$ for $y=e^{${k}x}$.`,k]},"91578");
add(4,"Y13","Integration & Area","Area between curves: integrate (top − bottom). For $y=kx$ and $y=x^2$ the area is $\\frac{k^3}{6}$.",()=>{if(P([0,1])){const k=3*R(1,4);return[`Find the area enclosed by $y=x^2$ and $y=${k}x$.`,k**3/6]}const a=R(1,4),b=R(0,4),k=R(1,3);return[`Evaluate $\\int_0^{${k}}(${a}x+${b})\\,dx$.`,a*k*k/2+b*k]},"91579");
add(4,"Y13","Time Series","A 3-point moving average smooths seasonal swings: average each value with its two neighbours.",()=>{const m=R(20,80),a=R(1,9),b=R(1,9);return[`Find the 3-point moving average of ${m-a}, ${m+b}, ${m+a-b}.`,m]},"91580");
add(4,"Y13","Bivariate Data & Residuals","Residual = actual $y$ − predicted $y$. Predict by substituting $x$ into the fitted line.",()=>{const m=R(2,9),c=R(1,30),x=R(2,15),e=R(-9,9);return[`The fitted line is $y=${m}x+${c}$. At $x=${x}$ the actual value is ${m*x+c+e}. Find the residual.`,e]},"91581");
add(4,"Y13","Formal Inference: Confidence Intervals","The interval for a median is $\\text{median}\\pm1.5\\times\\frac{IQR}{\\sqrt n}$. Calculate the half-width $1.5\\,IQR/\\sqrt n$.",()=>{const n=P([16,25,36,49,64,100]),m=R(1,12);return[`Sample size ${n} and IQR ${m*Math.sqrt(n)}. Find the half-width 1.5×IQR/√n.`,1.5*m]},"91582");
add(4,"Y13","Experiments & Reports (Knowledge Check)","Factorial experiments: treatments = levels of factor 1 × levels of factor 2 × …. A sample proportion is $\\hat p=\\frac xn$. This checks only the numeric side.",()=>{if(P([0,1])){const a=R(2,5),b=R(2,5),c=R(2,4);return[`An experiment has factors with ${a}, ${b} and ${c} levels. How many treatment combinations?`,a*b*c]}const n=R(2,20)*25,p=P([.2,.4,.6,.8,.5]);return[`In a sample of ${n}, ${Math.round(n*p)} said yes. Find the sample proportion as a decimal.`,p]},"91583 91584");
add(4,"Y13","Bayes & Conditional Probability","Total probability: $P(+)=P(D)P(+|D)+P(\\bar D)P(+|\\bar D)$.",()=>{const d=P([.1,.2,.3,.4,.5]),s=P([.8,.9]),f=P([.1,.2]);return[`P(disease) = ${d}. A test is positive for ${Math.round(s*100)}% of people with the disease and ${Math.round(f*100)}% without it. Find P(positive).`,Math.round((d*s+(1-d)*f)*100)/100]},"91585");
add(4,"Y13","Binomial Distribution","$P(X=k)=\\binom nk p^k(1-p)^{n-k}$ and the mean is $np$. Give a fraction or decimal.",()=>{if(P([0,1])){const n=R(3,6),k=R(0,n);return[`A fair coin is tossed ${n} times. What is the probability of exactly ${k} heads?`,C(n,k)/2**n]}const n=R(10,60),p=P([.1,.2,.25,.5]);return[`X is binomial with n = ${n} and p = ${p}. Find the mean E(X).`,n*p]},"91586 91267");
add(4,"Y13","Systems of Three Equations","Use substitution or elimination. If $x+y+z=S$, $x+y=A$ and $y+z=B$, then $y=A+B-S$.",()=>{const x=R(1,9),y=R(1,9),z=R(1,9);return[`$x+y+z=${x+y+z}$, $x+y=${x+y}$, $y+z=${y+z}$. Find $y$.`,y]},"91587");
// ---- NCEA achievement standards (codes verified against NZQA/TKI listings; L1 statistics titles from memory, please verify)
const STD="91026|1.1|Apply numeric reasoning in solving problems;91027|1.2|Apply algebraic procedures in solving problems;91028|1.3|Investigate relationships between tables, equations and graphs;91029|1.4|Apply linear algebra in solving problems;91030|1.5|Apply measurement in solving problems;91031|1.6|Apply geometric reasoning in solving problems;91032|1.7|Apply right-angled triangles in solving measurement problems;91033|1.8|Apply knowledge of geometric representations in solving problems;91034|1.9|Apply transformation geometry in solving problems;91035|1.10|Investigate a given multivariate data set using the statistical enquiry cycle;91036|1.11|Investigate bivariate numerical data using the statistical enquiry cycle;91037|1.12|Demonstrate understanding of chance and data;91038|1.13|Investigate a situation involving elements of chance;91256|2.1|Apply co-ordinate geometry methods in solving problems;91257|2.2|Apply graphical methods in solving problems;91258|2.3|Apply sequences and series in solving problems;91259|2.4|Apply trigonometric relationships in solving problems;91260|2.5|Apply network methods in solving problems;91261|2.6|Apply algebraic methods in solving problems;91262|2.7|Apply calculus methods in solving problems;91263|2.8|Design a questionnaire;91264|2.9|Use statistical methods to make an inference;91265|2.10|Conduct an experiment to investigate a situation using statistical methods;91266|2.11|Evaluate a statistically based report;91267|2.12|Apply probability methods in solving problems;91268|2.13|Investigate a situation involving elements of chance using a simulation;91269|2.14|Apply systems of equations in solving problems;91573|3.1|Apply the geometry of conic sections in solving problems;91574|3.2|Apply linear programming methods in solving problems;91575|3.3|Apply trigonometric methods in solving problems;91576|3.4|Use critical path analysis in solving problems;91577|3.5|Apply the algebra of complex numbers in solving problems;91578|3.6|Apply differentiation methods in solving problems;91579|3.7|Apply integration methods in solving problems;91580|3.8|Investigate time series data;91581|3.9|Investigate bivariate measurement data;91582|3.10|Use statistical methods to make a formal inference;91583|3.11|Conduct an experiment to investigate a situation using statistical methods;91584|3.12|Evaluate statistically based reports;91585|3.13|Apply probability concepts in solving problems;91586|3.14|Apply probability distributions in solving problems;91587|3.15|Apply systems of simultaneous equations in solving problems".split(";").map(x=>x.split("|"));
const OLD={"Pythagoras":"91032","Expanding Brackets":"91027","Quadratic Equations":"91027","Simultaneous Equations":"91029","Gradient":"91028","Trigonometry":"91032","Indices":"91027","Number Patterns":"91028","Compound Interest":"91026","Volume of Cylinders":"91030","Circle Theorems":"91031","Independent Probability":"91038","Standard Form":"91026","Differentiation":"91262","Integration":"91262 91579","Complex Numbers":"91577","Logarithms":"91261","Expected Value":"91267 91586","Arithmetic Series":"91258","Geometric Series":"91258"};
T.forEach(t=>t.a=t.a||OLD[t.t]||"");
function renderStd(){const L={1:"NCEA Level 1 (Year 11)",2:"NCEA Level 2 (Year 12)",3:"NCEA Level 3 (Year 13)"};
$("std").innerHTML=[1,2,3].map(l=>`<h4 style="color:var(--cyan);margin:14px 0 8px">${L[l]}</h4><div class="nodes">`+STD.filter(s=>s[1][0]==l).map(([c,n,ti])=>{const ts=T.filter(t=>t.a.split(" ").includes(c)),m=ts.filter(t=>S.mastered[t.t]).length;return`<button class="node ${ts.length&&m===ts.length?"m":""}" style="--c:#06B6D4" title="${ti}" onclick="byStd('${c}')">${c} · ${n} · ${ti} <small>${m}/${ts.length}</small></button>`}).join("")+"</div>").join("")}
function byStd(c){$("search").value=c;render();$("map").scrollIntoView({behavior:"smooth"})}
// ---- Engine
const KEY="astromaths_v2",$=id=>document.getElementById(id);
let S=load(),cur=null,Q=null;const pools={};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.mastered)return{att:{},best:{},...d}}catch(e){}return{xp:0,streak:0,last:"",mastered:{},att:{},best:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$("saved").textContent="💾 Progress saved"}catch(e){$("saved").textContent="⚠ Browser storage unavailable: use Export Flight Log to keep your progress"}}
const cnt=s=>T.filter(t=>t.s===s&&S.mastered[t.t]).length;
const open=s=>s===1||cnt(s-1)>=3;
function typeset(){if(window.renderMathInElement)renderMathInElement($("terminal"),{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false})}
function render(){
  const f=$("search").value.trim().toLowerCase(),n=Object.keys(S.mastered).length;
  $("xp").textContent=S.xp;$("streak").textContent=S.streak;$("mast").textContent=n+"/"+T.length;
  const rk=["Cadet","Navigator","Pilot","Commander","Admiral","Singularity Master"];
  $("rank").textContent="Rank: "+rk[Math.min(5,Math.floor(n/T.length*6))]+" · "+S.xp+" XP";$("prog").style.width=n/T.length*100+"%";
  let h="";SECTORS.forEach((sec,i)=>{const s=i+1,o=open(s);
    const ts=T.filter(t=>t.s===s&&(!f||(t.t+" "+t.y+" "+t.d+" "+sec.name+" "+sec.yrs+" "+t.a).toLowerCase().includes(f)));
    if(!ts.length)return;
    h+=`<div class="panel sector ${o?"":"locked"}" style="--c:${sec.c}"><h3>${o?"":"🔒 "}${sec.name}</h3><p>${sec.yrs} · ${cnt(s)}/${T.filter(t=>t.s===s).length} mastered${o?"":" · Master 3 topics in the previous sector to unlock"}</p><div class="nodes">`+
    ts.map(t=>`<button class="node ${S.mastered[t.t]?"m":""}" ${o?"":"disabled"} onclick="openT(${T.indexOf(t)})">${S.mastered[t.t]?"★ ":""}${t.t}<small>${t.y}</small></button>`).join("")+`</div></div>`});
  $("map").innerHTML=h||'<div class="panel">No activities match your search.</div>';renderStd();
}
function openT(i){cur=T[i];Q=null;$("terminal").style.display="block";$("tTitle").textContent=cur.t;
  $("tMeta").textContent=SECTORS[cur.s-1].name+" · "+cur.y+(cur.a?" · NCEA "+cur.a.split(" ").map(c=>{const x=STD.find(z=>z[0]===c);return"AS"+c+" ("+x[1]+")"}).join(", "):"")+(S.att[cur.t]?" · Attempts: "+S.att[cur.t]+" · Best run: "+(S.best[cur.t]||0)+"/10":"")+(S.mastered[cur.t]?" · MASTERED":"");
  $("how").textContent="How to: "+cur.d;$("startBtn").style.display="";$("quiz").style.display="none";$("msg").textContent="";
  typeset();$("terminal").scrollIntoView({behavior:"smooth"})}
function closeT(){$("terminal").style.display="none";cur=null;Q=null}
function pool(t){if(pools[t.t])return pools[t.t];const m=new Map();for(let i=0;i<1500&&m.size<50;i++){const x=t.g();m.set(x[0],x)}return pools[t.t]=[...m.values()]}
function startQ(){if(!cur)return;const p=pool(cur).slice().sort(()=>Math.random()-.5);Q={qs:p.slice(0,10),i:0};S.att[cur.t]=(S.att[cur.t]||0)+1;save();
  $("startBtn").style.display="none";$("quiz").style.display="block";$("retryBtn").style.display="none";$("sendBtn").style.display="";$("ans").style.display="";$("msg").textContent="";showQ()}
function showQ(){$("qn").textContent=`Question ${Q.i+1} of ${Q.qs.length} · no mistakes allowed`;$("tQ").textContent=Q.qs[Q.i][0];$("ans").value="";$("ans").focus();typeset()}
function parse(v){v=v.trim().replace(/\s/g,"");if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(v)){const[a,b]=v.split("/");return a/b}return v===""?NaN:Number(v)}
function check(){if(!Q||$("sendBtn").style.display==="none")return;const[,a]=Q.qs[Q.i],v=parse($("ans").value),m=$("msg");
  if(isNaN(v)){m.style.color="#F87171";m.textContent="Enter a number or fraction.";return}
  if(Math.abs(v-a)>0.0051){m.style.color="#F87171";m.textContent=`Incorrect. The answer was ${Math.round(a*1000)/1000}. Review the lesson above, then retry with 10 new questions.`;
    $("sendBtn").style.display="none";$("ans").style.display="none";$("retryBtn").style.display="";return}
  m.textContent="";Q.i++;S.best[cur.t]=Math.max(S.best[cur.t]||0,Q.i);save();
  if(Q.i<Q.qs.length)return showQ();
  $("quiz").style.display="none";m.style.color="var(--green)";
  if(!S.mastered[cur.t]){S.mastered[cur.t]=new Date().toISOString();S.xp+=100;m.textContent="🏆 Topic mastered! +100 XP"}else m.textContent="🏆 Passed again. Already mastered.";
  streak();save();render();$("tMeta").textContent+=" · MASTERED";Q=null}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(){const n=new Date(),t=ymd(n);if(S.last===t)return;const y=new Date(n);y.setDate(y.getDate()-1);S.streak=S.last===ymd(y)?S.streak+1:1;S.last=t}
function exportLog(){const b=new Blob([JSON.stringify({app:"AstroMaths",version:2,data:S},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="astromaths-flight-log-"+ymd(new Date())+".json";a.click();URL.revokeObjectURL(a.href)}
$("imp").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(typeof d.xp!=="number"||typeof d.mastered!=="object")throw 0;S={xp:d.xp,streak:d.streak||0,last:d.last||"",mastered:d.mastered,att:d.att||{},best:d.best||{}};save();render();closeT();alert("Flight log imported.")}catch(x){alert("Invalid flight log file (v1 logs are not compatible).")}};r.readAsText(f);e.target.value=""});
function resetAll(){if(confirm("Erase all progress on this device?")){S={xp:0,streak:0,last:"",mastered:{},att:{},best:{}};save();render();closeT()}}
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("search").addEventListener("input",render);addEventListener("pagehide",save);
(function(){const c=$("stars"),x=c.getContext("2d");let st=[];function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+.2,p:Math.random()*6,col:P(["#fff","#6366F1","#06B6D4","#F59E0B"])}))}
function f(t){x.clearRect(0,0,c.width,c.height);st.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1500+s.p));x.fillStyle=s.col;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(f)}
addEventListener("resize",rs);rs();requestAnimationFrame(f)})();
render();
</script>
